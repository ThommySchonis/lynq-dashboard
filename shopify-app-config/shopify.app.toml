# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a3739971455754dc098e864ff3aca60c"
application_url = "https://app.lynqflow.io"
embedded = false
name = "Lynq"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_order_edits,write_order_edits,read_draft_orders,write_draft_orders,read_fulfillments,write_fulfillments,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_customers,read_products,read_reports"
optional_scopes = [ ]
# This is a non-embedded app, so it acquires tokens via the authorization code
# grant (token exchange is embedded-only, requiring App Bridge session
# tokens). use_legacy_install_flow = true makes the App Store install redirect
# the merchant to application_url to begin OAuth.
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://app.lynqflow.io/api/auth/shopify/callback",
  "https://lynq-dashboard.vercel.app/api/auth/shopify/callback"
]

[webhooks]
api_version = "2026-04"

[webhooks.privacy_compliance]
customer_data_request_url = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify/compliance/customers-data-request"
customer_deletion_url = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify/compliance/customers-redact"
shop_deletion_url = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify/compliance/shop-redact"

# Managed Pricing plans are NOT declared here — Shopify CLI does not support
# the [app.subscription_plans] section in shopify.app.toml. Plans are created
# in the Partner dashboard: Apps → Lynq → App pricing → Create plan.
# Trial = 7 days. Do NOT reintroduce a 14-day trial or a €599 "Enterprise" plan.

[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify-billing/app-subscriptions-update"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify-billing/app-uninstalled"
