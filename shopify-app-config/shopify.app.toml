# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a3739971455754dc098e864ff3aca60c"
application_url = "https://lynq-dashboard.vercel.app"
embedded = false
name = "Lynq"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_analytics,read_customers,write_customers,read_price_rules,write_price_rules,read_discounts,write_discounts,write_draft_orders,read_draft_orders,read_fulfillments,write_fulfillments,read_inventory,read_locations,read_orders,write_orders,read_products,read_reports,read_returns,write_returns,read_shipping"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://lynq-dashboard.vercel.app/api/auth/shopify/callback",
  "http://localhost:3000/api/auth/shopify/callback"
]

[webhooks]
api_version = "2026-04"

[webhooks.privacy_compliance]
customer_data_request_url = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify/compliance/customers-data-request"
customer_deletion_url = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify/compliance/customers-redact"
shop_deletion_url = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify/compliance/shop-redact"

# Managed Pricing plans are NOT declared here — Shopify CLI does not support
# the [app.subscription_plans] section in shopify.app.toml. Plans must be
# created in the Partners dashboard: Apps → Lynq → App pricing → Create plan.
# See docs/superpowers/specs/2026-06-08-shopify-billing-integration-design.md
# for the canonical plan list (Starter €30, Growth €89, Scale €249, Enterprise €599,
# all monthly with 14-day trial).

[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify-billing/app-subscriptions-update"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://cvrzvhnsltjubmfkcxql.supabase.co/functions/v1/api/webhooks/shopify-billing/app-uninstalled"
